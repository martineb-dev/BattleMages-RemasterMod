name: Windows tooling checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse scripts and validate catalog
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Syntax.ps1
      - name: Exercise isolated fixtures (no game required)
        shell: ${{ matrix.shell }}
        run: ./tests/Smoke.Tests.ps1
  tooling-package:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package tracked tooling only
        shell: pwsh
        run: git archive --format=zip --output=BM-Mod-Tooling.zip HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BM-Mod-Tooling-${{ github.sha }}
          path: BM-Mod-Tooling.zip
          if-no-files-found: error
          retention-days: 30
